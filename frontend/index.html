<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地下管廊综合监控与智能运维系统</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.min.css" />
    <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
    <header class="header">
        <div class="header-content">
            <h1>🏗️ 地下管廊综合监控与智能运维系统</h1>
            <div class="header-stats">
                <div class="stat-item">
                    <span class="stat-label">管廊长度</span>
                    <span class="stat-value">15 km</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">舱室数量</span>
                    <span class="stat-value">3</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">设备总数</span>
                    <span class="stat-value" id="total-devices">380</span>
                </div>
            </div>
        </div>
    </header>

    <div class="main-container">
        <aside class="sidebar">
            <div class="sidebar-section">
                <h3>健康度评分</h3>
                <div class="health-score-container">
                    <canvas id="health-score-canvas" width="200" height="200"></canvas>
                    <div class="health-score-text">
                        <span class="score-value" id="health-score-value">--</span>
                        <span class="score-label">综合健康度</span>
                    </div>
                </div>
                <div class="health-details" id="health-details"></div>
            </div>

            <div class="sidebar-section">
                <h3>本月故障统计</h3>
                <div class="fault-stats">
                    <div class="fault-stat fault-level1">
                        <span class="fault-count" id="fault-level1">0</span>
                        <span class="fault-label">一级气体告警</span>
                    </div>
                    <div class="fault-stat fault-level2">
                        <span class="fault-count" id="fault-level2">0</span>
                        <span class="fault-label">二级窒息告警</span>
                    </div>
                    <div class="fault-stat fault-security">
                        <span class="fault-count" id="fault-security">0</span>
                        <span class="fault-label">安防告警</span>
                    </div>
                </div>
                <canvas id="fault-chart" width="280" height="150"></canvas>
            </div>

            <div class="sidebar-section">
                <h3>环境平均参数</h3>
                <div class="env-params">
                    <div class="env-param">
                        <span class="param-icon">🌡️</span>
                        <div>
                            <span class="param-label">温度</span>
                            <span class="param-value" id="avg-temp">--°C</span>
                        </div>
                    </div>
                    <div class="env-param">
                        <span class="param-icon">💧</span>
                        <div>
                            <span class="param-label">湿度</span>
                            <span class="param-value" id="avg-humidity">--%</span>
                        </div>
                    </div>
                    <div class="env-param">
                        <span class="param-icon">💨</span>
                        <div>
                            <span class="param-label">氧气</span>
                            <span class="param-value" id="avg-oxygen">--%</span>
                        </div>
                    </div>
                    <div class="env-param">
                        <span class="param-icon">⚠️</span>
                        <div>
                            <span class="param-label">甲烷</span>
                            <span class="param-value" id="avg-methane">--%</span>
                        </div>
                    </div>
                    <div class="env-param">
                        <span class="param-icon">☣️</span>
                        <div>
                            <span class="param-label">硫化氢</span>
                            <span class="param-value" id="avg-h2s">--ppm</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="sidebar-section">
                <h3>设备状态统计</h3>
                <div class="device-stats">
                    <div class="device-stat-row">
                        <span class="device-type">环境传感器</span>
                        <div class="device-counts">
                            <span class="count-normal" id="env-normal">200</span>
                            <span class="count-warning" id="env-warning">0</span>
                            <span class="count-fault" id="env-fault">0</span>
                        </div>
                    </div>
                    <div class="device-stat-row">
                        <span class="device-type">井盖传感器</span>
                        <div class="device-counts">
                            <span class="count-normal" id="manhole-normal">100</span>
                            <span class="count-warning" id="manhole-warning">0</span>
                            <span class="count-fault" id="manhole-fault">0</span>
                        </div>
                    </div>
                    <div class="device-stat-row">
                        <span class="device-type">排水泵</span>
                        <div class="device-counts">
                            <span class="count-normal" id="pump-normal">50</span>
                            <span class="count-warning" id="pump-warning">0</span>
                            <span class="count-fault" id="pump-fault">0</span>
                        </div>
                    </div>
                    <div class="device-stat-row">
                        <span class="device-type">风机</span>
                        <div class="device-counts">
                            <span class="count-normal" id="fan-normal">30</span>
                            <span class="count-warning" id="fan-warning">0</span>
                            <span class="count-fault" id="fan-fault">0</span>
                        </div>
                    </div>
                </div>
                <div class="legend">
                    <span><i class="status-dot status-normal"></i>正常</span>
                    <span><i class="status-dot status-warning"></i>预警</span>
                    <span><i class="status-dot status-fault"></i>故障</span>
                </div>
            </div>

            <div class="sidebar-section">
                <h3>设备运行状态</h3>
                <div class="equipment-status">
                    <div class="equip-item">
                        <span class="equip-icon">🌀</span>
                        <span class="equip-label">运行风机</span>
                        <span class="equip-value" id="running-fans">0 / 30</span>
                    </div>
                    <div class="equip-item">
                        <span class="equip-icon">💧</span>
                        <span class="equip-label">运行水泵</span>
                        <span class="equip-value" id="running-pumps">0 / 50</span>
                    </div>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <div class="map-toolbar">
                <div class="toolbar-group">
                    <label>图层筛选:</label>
                    <button class="layer-btn active" data-type="all">全部</button>
                    <button class="layer-btn" data-type="env_sensor">环境传感器</button>
                    <button class="layer-btn" data-type="manhole">井盖</button>
                    <button class="layer-btn" data-type="pump">排水泵</button>
                    <button class="layer-btn" data-type="fan">风机</button>
                </div>
                <div class="toolbar-group">
                    <label>舱室:</label>
                    <button class="chamber-btn active" data-chamber="all">全部</button>
                    <button class="chamber-btn" data-chamber="电力舱">电力舱</button>
                    <button class="chamber-btn" data-chamber="水信舱">水信舱</button>
                    <button class="chamber-btn" data-chamber="燃气舱">燃气舱</button>
                </div>
                <div class="toolbar-group">
                    <button id="refresh-btn" class="action-btn">🔄 刷新数据</button>
                </div>
            </div>

            <div id="map" class="map-container"></div>
        </main>

        <aside class="right-panel">
            <div class="panel-section active-alerts-section">
                <h3>🚨 活动告警</h3>
                <div class="alerts-list" id="active-alerts"></div>
            </div>

            <div class="panel-section device-detail-section" id="device-detail-panel" style="display: none;">
                <div class="panel-header">
                    <h3 id="device-detail-title">设备详情</h3>
                    <button class="close-btn" id="close-detail">&times;</button>
                </div>
                <div class="device-info" id="device-info"></div>
                
                <div class="chart-tabs">
                    <button class="tab-btn active" data-tab="trends">参数趋势</button>
                    <button class="tab-btn" data-tab="operations">操作历史</button>
                </div>
                
                <div class="tab-content" id="trends-tab">
                    <canvas id="trend-chart" width="320" height="200"></canvas>
                </div>
                
                <div class="tab-content" id="operations-tab" style="display: none;">
                    <div class="operations-list" id="operations-list"></div>
                </div>

                <div class="device-controls" id="device-controls"></div>
            </div>
        </aside>
    </div>

    <div id="alert-modal" class="modal">
        <div class="modal-content alert-modal">
            <div class="modal-header">
                <h2 id="alert-modal-title">⚠️ 告警通知</h2>
            </div>
            <div class="modal-body" id="alert-modal-body"></div>
            <div class="modal-footer">
                <button class="modal-btn acknowledge-btn" id="acknowledge-btn">确认告警</button>
                <button class="modal-btn close-modal-btn" id="close-modal-btn">关闭</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="/static/js/corridor_map.js"></script>
    <script src="/static/js/device_detail.js"></script>
    <script src="/static/js/map.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
