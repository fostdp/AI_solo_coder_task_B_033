fuzzy_logic:
  version: "1.0"
  description: "智能通风控制模糊逻辑配置"

  input_variables:
    oxygen:
      name: "氧气浓度"
      unit: "%"
      membership_functions:
        very_low:
          type: "trapezoid"
          params: [-1, 0, 16, 17]
        low:
          type: "trapezoid"
          params: [16, 17, 18, 18.5]
        slightly_low:
          type: "trapezoid"
          params: [18, 18.5, 19, 19.5]
        normal:
          type: "trapezoid"
          params: [19, 19.5, 21, 22]
        high:
          type: "trapezoid"
          params: [21, 22, 100, 101]
      crisp_thresholds:
        very_low: 17.0
        low: 18.5
        slightly_low: 19.5
        normal: 21.0
        high: 21.0

    temperature:
      name: "温度"
      unit: "℃"
      membership_functions:
        low:
          type: "trapezoid"
          params: [-41, -40, 24, 25]
        medium:
          type: "trapezoid"
          params: [24, 25, 29, 30]
        high:
          type: "trapezoid"
          params: [29, 30, 34, 35]
        very_high:
          type: "trapezoid"
          params: [34, 35, 85, 86]
      crisp_thresholds:
        low: 25.0
        medium: 30.0
        high: 35.0
        very_high: 35.0

    humidity:
      name: "湿度"
      unit: "%"
      membership_functions:
        low:
          type: "trapezoid"
          params: [-1, 0, 39, 40]
        normal:
          type: "trapezoid"
          params: [39, 40, 59, 60]
        high:
          type: "trapezoid"
          params: [59, 60, 79, 80]
        very_high:
          type: "trapezoid"
          params: [79, 80, 100, 101]
      crisp_thresholds:
        low: 40.0
        normal: 60.0
        high: 80.0
        very_high: 80.0

  output_variables:
    fan:
      name: "风机控制"
      ranges:
        should_run: [false, true]
        speed: [0, 100]

  rule_base:
    description: "模糊控制规则库 - 氧气×温度×湿度 → 风机控制"
